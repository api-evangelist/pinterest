      example: AD
      enum:
      - CAMPAIGN
      - AD_GROUP
      - PRODUCT_GROUP
      - AD
      - KEYWORD
    AdGroupCommon:
      type: object
      properties:
        name:
          description: Ad group name.
          type: string
          example: 'Ad Group For Pin: 687195905986'
        status:
          type: string
          allOf:
          - $ref: '#/components/schemas/EntityStatus'
          description: Ad group/entity status.
        budget_in_micro_currency:
          description: Budget in micro currency. This field is **REQUIRED** for non-CBO (campaign budget optimization) campaigns.  A CBO campaign automatically generates ad group budgets from its campaign budget to maximize campaign outcome. A CBO campaign is limited to 70 or less ad groups.
          type: integer
          example: 5000000
          nullable: true
        bid_in_micro_currency:
          description: 'Bid price in micro currency. This field is **REQUIRED** for the following campaign objective_type/billable_event combinations: AWARENESS/IMPRESSION, CONSIDERATION/CLICKTHROUGH, CATALOG_SALES/CLICKTHROUGH, VIDEO_VIEW/VIDEO_V_50_MRC.'
          type: integer
          example: 5000000
          nullable: true
        optimization_goal_metadata:
          type: object
          allOf:
          - $ref: '#/components/schemas/OptimizationGoalMetadata'
          description: Optimization goals for objective-based performance campaigns. **REQUIRED** when campaign's `objective_type` is set to `"WEB_CONVERSION"`.
          nullable: true
        budget_type:
          type: string
          allOf:
          - $ref: '#/components/schemas/BudgetType'
        start_time:
          description: Ad group start time. Unix timestamp in seconds. Defaults to current time.
          type: integer
          example: 5686848000
          nullable: true
        end_time:
          description: Ad group end time. Unix timestamp in seconds.
          type: integer
          example: 5705424000
          nullable: true
        targeting_spec:
          $ref: '#/components/schemas/TargetingSpec'
        lifetime_frequency_cap:
          description: Set a limit to the number of times a promoted pin from this campaign can be impressed by a pinner within the past rolling 30 days. Only available for CPM (cost per mille (1000 impressions))  ad groups. A CPM ad group has an IMPRESSION <a href="https://developers.pinterest.com/docs/redoc/#section/Billable-event">billable_event</a> value. This field **REQUIRES** the `end_time` field.
          type: integer
          example: 100
        tracking_urls:
          type: object
          allOf:
          - $ref: '#/components/schemas/TrackingUrls'
          description: 'Third-party tracking URLs.<br> JSON object with the format: {"<a href="https://developers.pinterest.com/docs/redoc/#section/Tracking-URL-event">Tracking event enum</a>":[URL string array],...}<br> For example: {"impression": ["URL1", "URL2"], "click": ["URL1", "URL2", "URL3"]}.<br>Up to three tracking URLs are supported for each event type. Tracking URLs set at the ad group or ad level can override those set at the campaign level. May be null. Pass in an empty object - {} - to remove tracking URLs.<br><br> For more information, see <a href="https://help.pinterest.com/en/business/article/third-party-and-dynamic-tracking" target="_blank">Third-party and dynamic tracking</a>.'
          nullable: true
        auto_targeting_enabled:
          type: boolean
          description: Enable auto-targeting for ad group. Also known as <a href="https://help.pinterest.com/en/business/article/expanded-targeting" target="_blank">"expanded targeting"</a>.
          example: true
          nullable: true
        placement_group:
          type: string
          allOf:
          - $ref: '#/components/schemas/PlacementGroupType'
          description: <a href="https://developers.pinterest.com/docs/redoc/#section/Placement-group">Placement group</a>.
        pacing_delivery_type:
          type: string
          allOf:
          - $ref: '#/components/schemas/PacingDeliveryType'
        campaign_id:
          description: Campaign ID of the ad group.
          type: string
          pattern: ^[C]?\d+$
          example: '626736533506'
        billable_event:
          $ref: '#/components/schemas/ActionType'
        bid_strategy_type:
          nullable: true
          description: Bid strategy type
          enum:
          - AUTOMATIC_BID
          - MAX_BID
          - TARGET_AVG
          - null
          example: MAX_BID
          title: BidStrategyType
          type: string
        targeting_template_ids:
          type: array
          description: 'Targeting template IDs applied to the ad group. We currently only support 1 targeting template per ad group. To use targeting templates, do not set any other targeting fields: targeting_spec, tracking_urls, auto_targeting_enabled, placement_group. To clear all targeting template IDs, set this field to [''0''].'
          items:
            description: Targeting template ID.
            type: string
            pattern: ^\d+$
            example: '643'
          maxItems: 1
          nullable: true
